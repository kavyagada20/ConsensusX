project:
  name: ConsensusX
  title: "Adversarial Reasoning and Multi-Agent Conflict Resolution in AI Systems"
  tagline: "Beyond Consensus. Towards Evidence-Based AI Decisions."
  random_seed: 42

data:
  raw_dev_path: "data/raw/fever/shared_task_dev.jsonl"
  raw_train_path: "data/raw/fever/train.jsonl"
  sample_size: 300
  stratified: true
  labels:
    - SUPPORTS
    - REFUTES
    - NOT ENOUGH INFO

llm:
  # Supported providers: "mock", "gemini", "xai"
  provider: "mock"
  model: "gemini-2.0-flash"  # For xAI use: "grok-2" or "grok-4.7"
  temperature: 0.0
  max_tokens: 1024
  timeout_seconds: 30
  retry_attempts: 3
  cache_enabled: true
  cache_dir: ".cache/llm_responses"

experiment:
  configurations:
    - single_agent_baseline  # Config 1: Zero-shot single verifier
    - majority_voting        # Config 2: N-agent independent reasoning + majority vote
    - multi_agent_debate     # Config 3: Multi-turn debate with cross-examination & rebuttals
    - consensus_x            # Config 4: Evidence-audited debate (Phases 5 & 6)
  num_agents: 3              # Committee size for voting and debate
  debate_rounds: 2           # Number of rounds (1 = initial independent, 2+ = rebuttals)
  voting_tie_breaker: "confidence_weighted" # Fallback: "epistemic_humility_default_nei"
  inject_adversary: false
  adversary_persona: "persuasive_contrarian"

evaluation:
  metrics:
    - accuracy
    - macro_f1
    - fever_score
    - false_consensus_rate
    - adversarial_vulnerability_score
    - latency_seconds
    - token_usage
  output_dir: "outputs"

retrieval:
  corpus_path: "data/processed/dev_corpus.jsonl"
  index_dir: "data/processed/faiss_index"
  embedding_provider: "mock" # Options: mock, gemini, sentence_transformer
  embedding_model: "hash-embedding-128" # For Gemini: text-embedding-004
  top_k: 5
  batch_size: 128

judge:
  prompt_version: "v1.0.0"
  agent_id: "evidence_judge"
  require_valid_citation: true
  downgrade_ungrounded_verdicts: true

adaptive_stopping:
  enabled: true
  min_rounds: 1
  max_rounds: 3
  stability_threshold: 1.0
  require_evidence_grounding: true
  stop_on_unanimous_only_if_grounded: true

adversary:
  enabled: false
  persona: "persuasive_contrarian" # Options: persuasive_contrarian, citation_distorter
  attack_strength: "assertive"     # Options: assertive, subtle
  agent_index: 1                   # 0-indexed position in committee




