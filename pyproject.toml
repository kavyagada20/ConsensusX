[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus-x"
version = "0.1.0"
description = "ConsensusX: Adversarial Reasoning and Multi-Agent Conflict Resolution in AI Systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kavya Gada" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]

